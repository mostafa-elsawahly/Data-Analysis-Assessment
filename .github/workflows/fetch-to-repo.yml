name: Fetch OPM data to repo and Azure

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets to fetch, separated by spaces"
        default: "accessions separations employment"
  schedule:
    - cron: "0 6 5 * *"

permissions:
  contents: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Fetch and clean data
        run: python -u fetch_to_repo.py ${{ inputs.datasets || 'accessions separations employment' }}

      - name: Check file sizes
        run: |
          big=$(find datasets -type f -size +95M)
          if [ -n "$big" ]; then
            echo "::error::Files larger than 95MB cannot be pushed to GitHub: $big"
            exit 1
          fi
          du -sh datasets

      - name: Commit and push, one year at a time
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "--- tracked files with changes before commit ---"
          git status --short | grep -v '^??' | head -20 || true
          for y in 2022 2023 2024 2025 2026; do
            [ -d "datasets/$y" ] || continue
            git add "datasets/$y"
            if ! git diff --cached --quiet; then
              git commit -m "Data update $y"
              git push origin main || {
                git pull --rebase --autostash origin main
                git push origin main
              }
            fi
          done

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Azure Blob
        run: |
          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --destination "$AZURE_STORAGE_CONTAINER" \
            --source datasets \
            --auth-mode login \
            --overwrite false \
            --only-show-errors
