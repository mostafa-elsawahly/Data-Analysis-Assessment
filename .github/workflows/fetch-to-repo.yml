name: Fetch OPM data to repo and Azure

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to fetch"
        type: choice
        options:
          - accessions
          - separations
          - employment
        default: accessions
      years:
        description: "Year to fetch"
        type: choice
        options:
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"
          - "2022-2026"
        default: "2022"

permissions:
  contents: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Fetch and clean ${{ inputs.dataset }} ${{ inputs.years }}
        run: |
          YEARS="${{ inputs.years }}"
          export YEAR_FROM="${YEARS%-*}"
          export YEAR_TO="${YEARS#*-}"
          echo "Years: $YEAR_FROM to $YEAR_TO"
          python -u fetch_to_repo.py ${{ inputs.dataset }}

      - name: Check file sizes
        run: |
          big=$(find datasets -type f -size +95M)
          if [ -n "$big" ]; then
            echo "::error::Files larger than 95MB cannot be pushed to GitHub: $big"
            exit 1
          fi
          du -sh datasets

      - name: Commit and push, one year at a time
        run: |
          git config user.name
